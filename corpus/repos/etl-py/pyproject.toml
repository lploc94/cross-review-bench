[project]
name = "etl"
version = "1.0.0"
description = "Batch ETL from retail source exports into a PostgreSQL warehouse"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "typer>=0.15",
    "tzdata>=2024.1",
]

[project.scripts]
etl = "etl.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:etl.*"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "S", "C4", "DTZ", "SIM", "RET", "PT", "PIE",
    "TID", "RUF", "PERF", "LOG", "G",
]
ignore = [
    # Error names follow the domain vocabulary (SchemaMismatch, RunLocked, ...)
    "N818",
    # Typer declares options through default values
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "PLR2004", "DTZ001"]
"migrations/versions/*" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["etl", "tests"]
