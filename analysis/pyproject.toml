[project]
name = "crb-analysis"
version = "0.1.0"
description = "Cross-Review Bench: pre-registered statistics, tables and figures from scores.jsonl"
authors = [{ name = "Thorn Le" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crb_analysis"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
